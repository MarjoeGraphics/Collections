<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Marjoe - Portfolio Redirect</title>
    <script type="text/javascript">
      // GitHub Pages doesn't support clean URLs for static sites by default.
      // This 404 page catches any path-based company URLs and redirects them
      // as a query parameter back to the index.html

      var pathSegments = window.location.pathname.toLowerCase().split('/');
      var companyIndex = pathSegments.indexOf('collections');

      if (companyIndex !== -1 && pathSegments[companyIndex + 1]) {
        var company = pathSegments[companyIndex + 1];
        window.location.replace('/index.html?for=' + company);
      } else {
        // Just go home
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
    Redirecting to targeted portfolio...
  </body>
</html>
