<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marjoe - Portfolio</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Animation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="scroll-progress" role="progressbar" aria-label="Page scroll progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <a href="#" class="branding" aria-label="Marjoe - Back to top">Marjoe</a>

                <div class="nav-links desktop-links">
                    <a href="#work">Work</a>
                    <a href="#about">About</a>
                    <a href="#contact">Contact</a>
                </div>

                <div class="nav-actions">
                    <button id="theme-toggle" aria-label="Toggle Theme">
                        <i data-lucide="sun" class="sun-icon"></i>
                        <i data-lucide="moon" class="moon-icon"></i>
                    </button>
                    <button id="mobile-menu-toggle" aria-label="Open Menu" aria-expanded="false" aria-controls="mobile-menu" class="mobile-only">
                        <i data-lucide="menu" class="menu-icon"></i>
                        <i data-lucide="x" class="close-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Mobile Menu Overlay -->
            <div id="mobile-menu" class="mobile-menu mobile-only" aria-hidden="true">
                <div class="mobile-menu-links">
                    <a href="#work">Work</a>
                    <a href="#about">About</a>
                    <a href="#contact">Contact</a>
                </div>
            </div>
        </nav>
    </header>

    <main id="main-content">
        <section class="hero">
            <div class="hero-bg-container">
                <div class="mesh-gradient"></div>
                <canvas class="particles-canvas" id="particles"></canvas>
            </div>
            <div class="hero-content">
                <h1 class="hero-title">Graphic Designer & <br>Multimedia Artist</h1>
                <p class="hero-subtitle">Crafting Visual Stories with Elegance & Precision</p>
            </div>
            <a href="#work" class="scroll-down" aria-label="Scroll to work">
                <span>Scroll Down</span>
                <i data-lucide="chevron-down"></i>
            </a>
        </section>

        <section id="work" style="height: 100vh; padding: 100px 20px;">
            <h1>Work</h1>
            <p>Check out my projects.</p>
        </section>
        <section id="about" style="height: 100vh; padding: 100px 20px; position: relative; background: var(--bg-color); z-index: 2;">
            <h1>About</h1>
            <p>Welcome to my portfolio.</p>
        </section>
        <section id="contact" style="height: 100vh; padding: 100px 20px;">
            <h1>Contact</h1>
            <p>Get in touch.</p>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
