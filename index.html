<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marjoe - Portfolio</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #fdfdfd; /* Off-White */
            --text-color: #1a1a1a; /* Deep Charcoal */
            --accent-color: #c5a059; /* Gold */
            --nav-bg: rgba(253, 253, 253, 0.7);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212; /* Deep Charcoal/Black */
            --text-color: #fdfdfd; /* Off-White */
            --accent-color: #d4af37; /* Lighter Gold */
            --nav-bg: rgba(18, 18, 18, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            min-height: 200vh; /* For scrolling test */
        }

        h1, h2, h3, .branding {
            font-family: 'Playfair Display', serif;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background-color: var(--nav-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .branding {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            transition: color 0.3s ease;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: var(--accent-color);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s;
        }

        button:hover {
            color: var(--accent-color);
        }

        .sun-icon {
            display: block;
        }
        .moon-icon {
            display: none;
        }

        [data-theme="dark"] .sun-icon {
            display: none;
        }
        [data-theme="dark"] .moon-icon {
            display: block;
        }

        .mobile-only {
            display: none;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .desktop-links {
                display: none;
            }

            .mobile-only {
                display: block;
            }

            .mobile-menu {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: var(--bg-color);
                border-bottom: 1px solid var(--border-color);
                display: none;
                flex-direction: column;
                padding: 1rem 0;
                transition: all 0.3s ease;
            }

            .mobile-menu.active {
                display: flex;
            }

            .mobile-menu-links {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.5rem;
            }

            .mobile-menu-links a {
                text-decoration: none;
                color: var(--text-color);
                font-weight: 500;
                text-transform: uppercase;
                font-size: 1rem;
                letter-spacing: 1px;
                transition: color 0.3s ease;
            }

            .mobile-menu-links a:hover {
                color: var(--accent-color);
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="branding">Marjoe</div>

                <div class="nav-links desktop-links">
                    <a href="#about">About</a>
                    <a href="#work">Work</a>
                    <a href="#contact">Contact</a>
                </div>

                <div class="nav-actions">
                    <button id="theme-toggle" aria-label="Toggle Theme">
                        <i data-lucide="sun" class="sun-icon"></i>
                        <i data-lucide="moon" class="moon-icon"></i>
                    </button>
                    <button id="mobile-menu-toggle" aria-label="Open Menu" class="mobile-only">
                        <i data-lucide="menu"></i>
                    </button>
                </div>
            </div>

            <!-- Mobile Menu Overlay -->
            <div id="mobile-menu" class="mobile-menu mobile-only">
                <div class="mobile-menu-links">
                    <a href="#about">About</a>
                    <a href="#work">Work</a>
                    <a href="#contact">Contact</a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section id="about" style="height: 100vh; padding: 100px 20px;">
            <h1>About</h1>
            <p>Welcome to my portfolio.</p>
        </section>
        <section id="work" style="height: 100vh; padding: 100px 20px;">
            <h1>Work</h1>
            <p>Check out my projects.</p>
        </section>
        <section id="contact" style="height: 100vh; padding: 100px 20px;">
            <h1>Contact</h1>
            <p>Get in touch.</p>
        </section>
    </main>

    <script>
        // Lucide icons initialization
        lucide.createIcons();

        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        });

        // Mobile Menu Logic
        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const mobileLinks = document.querySelectorAll('.mobile-menu-links a');

        mobileMenuToggle.addEventListener('click', () => {
            mobileMenu.classList.toggle('active');
        });

        // Close mobile menu when a link is clicked
        mobileLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.remove('active');
            });
        });
    </script>
</body>
</html>
